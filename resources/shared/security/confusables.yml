# Confusable skeleton mappings used by TwitterCldr::Security (UTS #39, Section 4).
#
# Data pinned to Unicode 16.0.0, the same Unicode version as the bundled
# property data (see TwitterCldr::Versions::UNICODE_VERSION). Keys are hex
# code point sequences, values are the replacement ("prototype") strings.
#
# This is a curated subset of confusables.txt covering the most common
# cross-script spoofing vectors (Latin/Greek/Cyrillic homoglyphs, fullwidth
# ASCII, and frequent punctuation lookalikes). Regenerate the complete table
# from the official Unicode data file with:
#
#   bundle exec rake update:security_data
#
