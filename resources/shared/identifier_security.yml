# UTS #39 (Unicode Security Mechanisms) identifier data.
#
# Pinned to Unicode 16.0.0, matching TwitterCldr::Versions::UNICODE_VERSION.
# Do not update this file independently of the Unicode data under
# resources/unicode_data (Script, Script_Extensions, etc.).
#
# :confusables is a curated subset of confusables.txt (Unicode 16.0.0)
# covering the highest-risk cross-script homoglyphs used in identifier
# spoofing (Latin <-> Cyrillic, Latin <-> Greek, Latin <-> Armenian,
# Latin <-> Cherokee), plus fullwidth ASCII forms and a few common
# punctuation/digit lookalikes. Keys are source code points, values are
# the code points of the skeleton replacement. Additional entries from
# confusables.txt 16.0.0 can be appended without code changes.
#
# :recommended_scripts / :aspirational_scripts follow UTS #39 Table 5
# (Recommended and Aspirational scripts, Unicode 16.0.0) and drive
# restriction-level computation.

:unicode_version: '16.0.0'

:recommended_scripts:
